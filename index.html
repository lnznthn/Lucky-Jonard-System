<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bodega">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0D0D" media="(prefers-color-scheme: dark)">
<script data-boot>/* Applies the stored theme before the first paint. Same rule as applyTheme() below. */
try { var t = (JSON.parse(localStorage.getItem('toys.prefs')) || {}).theme; if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#0D0D0D' : '#FAFAFA'; }); } } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Bodega</title>
<style>
@font-face{font-family:'Bebas Neue';src:url(fonts/bebas-neue-latin-400-normal.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Geist';src:url(fonts/geist-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Geist';src:url(fonts/geist-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Geist';src:url(fonts/geist-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
/* Tokens: light here, dark for a dark device (unless Light was chosen) and for an explicit Dark. Rules below use only tokens. */
:root{--bg:#FAFAFA;--text:#0D0D0D;--muted:#5C5C5C;--line:rgba(0,0,0,0.16);--field:#FFFFFF;--raise:#FFFFFF;--raise-edge:#0D0D0D;--accent:#FFD400;--accent-edge:#9A8000;--on-accent:#0D0D0D;--attn:#7A6000;--danger:#B3261E;--scrim:rgba(0,0,0,0.5);
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--display:'Bebas Neue','Arial Narrow','Roboto Condensed',Impact,sans-serif;--sec:var(--bg);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0D0D;--text:#FAFAFA;--muted:#A3A3A3;--line:rgba(255,255,255,0.14);--field:#161616;--raise:#242424;--raise-edge:#000000;--attn:#FFD400;--danger:#FF6B6B;--scrim:rgba(0,0,0,0.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0D0D;--text:#FAFAFA;--muted:#A3A3A3;--line:rgba(255,255,255,0.14);--field:#161616;--raise:#242424;--raise-edge:#000000;--attn:#FFD400;--danger:#FF6B6B;--scrim:rgba(0,0,0,0.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 var(--sans)}
b,strong{font-weight:600}
h1,h2,h3,p{margin:0;font-weight:400}
.app{max-width:720px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header.top{display:flex;align-items:center;gap:2px;min-height:68px;padding:12px 8px 12px 16px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5}
header.top h1{flex:1;min-width:0;font:400 28px/1 var(--display);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;padding:6px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
main>:empty,#addInv>:empty{display:none}
button{font:inherit;color:inherit;cursor:pointer}
svg{flex:none;display:block}
.icon{width:44px;height:44px;border:0;padding:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.icon[hidden]{display:none}
.sync{min-height:44px;padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:13px;white-space:nowrap}
.sync.pending{color:var(--attn)}.sync.err{color:var(--danger)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs .brand{display:none}
nav.tabs .navtog,nav.tabs .bd{display:none}
nav.tabs button{flex:1;min-height:60px;border:0;border-top:2px solid transparent;margin-top:-1px;background:none;color:var(--muted);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav.tabs button.on{color:var(--text);border-top-color:var(--text)}
/* Buttons: a solid lower layer marks something to press; pressing moves the face down onto it. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;margin-bottom:4px;border:1px solid var(--line);background:var(--raise);color:var(--text);box-shadow:0 4px 0 var(--raise-edge);font-size:16px;font-weight:500;line-height:1.2;text-align:center}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 2px 0 var(--raise-edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-edge);font-weight:600}
.btn.primary:active:not([disabled]){box-shadow:0 2px 0 var(--accent-edge)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;white-space:nowrap;flex:none;box-shadow:0 3px 0 var(--raise-edge);margin-bottom:3px}
.btn.sm:active:not([disabled]){box-shadow:0 1px 0 var(--raise-edge)}
.btn.big{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.tbtn{min-height:44px;padding:0;border:0;background:transparent;color:var(--text);font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:4px;text-align:left;align-self:flex-start}
.tbtn.danger{color:var(--danger)}
.tbtn.c{align-self:center}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.links{display:flex;flex-wrap:wrap;align-items:center;column-gap:20px}
.links .btn{white-space:nowrap}
/* Sections: a hairline box with its title on the top rule. */
.sec{position:relative;margin-top:10px;border:1px solid var(--line)}
.sec>h2{position:absolute;top:-10px;left:10px;padding:0 8px;background:var(--sec);display:flex;align-items:center;gap:8px;font:500 13px/20px var(--sans);color:var(--muted)}
.sec.pad{padding:22px 14px 14px;display:flex;flex-direction:column;gap:16px}
.badge{padding:0 8px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;line-height:20px}
.list{border:1px solid var(--line)}
.sec>.list{border:0}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left}
.item:last-child{border-bottom:0}
.item .main,.picked .main,.prow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .name{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chev{color:var(--muted);transform:rotate(-90deg)}
.qty,.delta{min-width:36px;text-align:right;font:400 28px/1 var(--display);letter-spacing:.02em;white-space:nowrap}
.amt{font:400 22px/1 var(--display);letter-spacing:.02em;white-space:nowrap}
.out{color:var(--attn)}.neg{color:var(--danger)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.more.up svg{transform:rotate(180deg)}
.tag{margin-left:6px;font-size:13px;font-weight:500;color:var(--muted)}
.tag.warn{color:var(--attn)}.tag.bad{color:var(--danger)}
/* Filters and switches are text tabs with a rule under the chosen one. */
.seg{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:44px;padding:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:15px;font-weight:500;white-space:nowrap}
.seg button.on{color:var(--text);border-bottom-color:var(--text)}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);padding:0 12px;width:100%;min-height:48px}
textarea{padding:10px 12px;resize:vertical;line-height:1.4}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--text);outline-offset:-2px}
input[type=checkbox]{accent-color:var(--accent);width:22px;height:22px;min-height:0;margin:0}
label,.lbl{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.row2:empty{display:none}
.units input{width:136px;flex:none}
.step{display:flex;gap:8px}.step .btn{min-width:52px;min-height:48px;padding:0}
.step input{text-align:center}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-top:0;background:var(--field)}
.sug:empty{display:none}
.sug button{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px 14px;text-align:left;min-height:48px}
.sug button:last-child{border-bottom:0}
.sug button[disabled]{color:var(--muted)}
.picked{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border:1px solid var(--line);background:var(--field)}
.picked .name{font-size:15px;font-weight:500}
.hint,.prow .sub{color:var(--muted);font-size:13px}
.hint b{color:var(--text);font-weight:500}
.banner{border:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;column-gap:12px;flex-wrap:wrap;font-size:15px}
.banner.bad{border-color:var(--danger)}.banner.warn{border-color:var(--attn)}.banner.danger{border-color:var(--danger);color:var(--danger)}
.banner>span{flex:1;min-width:180px;padding:6px 0}
.notice{border:1px solid var(--attn);padding:12px 14px 2px;display:flex;flex-direction:column;gap:4px}
.notice .t{font-size:15px;font-weight:500}
.empty{color:var(--muted);font-size:15px}
.empty h3{color:var(--text);font-size:16px;font-weight:600;margin-bottom:6px}
.empty p{margin-bottom:16px}
.strip{display:flex;width:100%;padding:0;border:0;background:transparent;color:var(--text);text-align:left}
.cell{flex:1;min-width:0;padding:16px 14px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.cell:last-child{border-right:0}
.cell small{font-size:13px;color:var(--muted)}
.cell b{font:400 28px/1 var(--display);letter-spacing:.02em;overflow-wrap:anywhere}
.tot{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.tot>div{display:flex;align-items:baseline;gap:12px}
.tot span{flex:1;font-size:13px;color:var(--muted)}
.tot b{font:400 20px/1 var(--display);letter-spacing:.02em}
.tot .big span{font-size:15px;color:var(--text)}.tot .big b{font-size:28px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:15px}.kv dt{color:var(--muted);font-size:13px;padding-top:2px}.kv dd{margin:0;overflow-wrap:anywhere}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:44px;font-size:15px;font-weight:500;color:var(--text)}
details>summary::-webkit-details-marker{display:none}
details>summary span{text-decoration:underline;text-underline-offset:4px}
details[open]>summary svg{transform:rotate(180deg)}
details>.stack{padding-top:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--text);margin:0;cursor:pointer}
.logo{max-height:48px;max-width:120px;border:1px solid var(--line);flex:none}
.prow{display:flex;align-items:flex-start;gap:12px;min-height:60px;padding:12px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow input[type=checkbox]{margin:1px 0 0;flex:none}
.prow .name{font-size:15px;font-weight:500;color:var(--text);margin:0;cursor:pointer}
.prow button.name{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
details.grp>summary{padding:14px 14px 4px;font-size:13px;color:var(--muted);font-weight:500}
/* Apply stays in reach on a phone: it sits just above the tab bar while the review scrolls. */
.applybar{position:sticky;bottom:calc(61px + env(safe-area-inset-bottom));z-index:4;background:var(--bg);padding:12px 0 2px;display:flex;flex-direction:column;gap:6px}
.prow.off .name{color:var(--muted)}
.cols,.cols>div{display:flex;flex-direction:column;gap:20px}
.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.layer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{--sec:var(--raise);position:relative;background:var(--raise);border:1px solid var(--line);border-bottom:0;width:100%;max-width:720px;max-height:92dvh;overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.sheet .top{display:flex;align-items:center;gap:8px;margin-right:-8px;min-height:44px}
.sheet .top h2{flex:1;min-width:0;font:400 28px/1.05 var(--display);letter-spacing:.02em;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 16px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:30;width:max-content;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop: side navigation, wider pages, two columns, sheets as dialogs ---------- */
@media(min-width:900px){
  .app{max-width:none;margin:0 0 0 228px}
  header.top{padding:18px 24px 10px 32px}
  main{padding:6px 32px 48px;max-width:1600px}
  main.v-stock{max-width:none}
  main.v-home{max-width:1160px}
  main.v-move{max-width:760px}
  nav.tabs{top:0;right:auto;width:228px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:18px 12px}
  nav.tabs .in{flex-direction:column;gap:2px;max-width:none}
  nav.tabs .brand{display:block;font:400 28px/1 var(--display);letter-spacing:.02em;padding:6px 14px 22px}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 14px;border-top:0;margin:0;font-size:15px}
  nav.tabs button.on{font-weight:600}
  nav.tabs .navtog{display:flex;align-items:center;justify-content:flex-start;min-height:36px;padding:0 14px;border:0;background:none;color:var(--muted)}
  html[data-mini] .app{margin-left:64px}
  html[data-mini] nav.tabs{width:64px;padding:18px 8px}
  html[data-mini] nav.tabs .navtog{justify-content:center;padding:0}
  html[data-mini] nav.tabs .brand,html[data-mini] nav.tabs .lb{display:none}
  html[data-mini] nav.tabs #tabs button{position:relative;justify-content:center;padding:0}
  html[data-mini] nav.tabs .bd{display:block;position:absolute;top:4px;right:4px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--text);color:var(--bg);font-size:11px;line-height:16px;text-align:center}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
  /* Tables: one style for every table. 13 px text, rows about 30 px, a fixed width per column kind (tableTag()), long text cut with an ellipsis;
     the header stays in view, and a wide table scrolls sideways inside its own box. */
  .tbl{overflow:auto;max-height:calc(100dvh - 92px);border:1px solid var(--line)}
  .sec .tbl{border:0}.sec>.tbl{margin-top:10px}
  .tbl table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13px;line-height:18px}
  .tbl thead{position:sticky;top:0;z-index:1}
  .tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl th{background:var(--bg);font-weight:500;color:var(--muted);white-space:normal;line-height:16px;padding-top:8px;padding-bottom:8px}
  .tbl th[aria-sort]{color:var(--text)}
  .tbl .th{display:flex;align-items:center;gap:2px}
  .tbl th button{padding:0;border:0;background:none;color:inherit;font:inherit;text-align:inherit}
  .tbl .sb{flex:1;min-width:0}
  .tbl .sb svg{display:inline-block;vertical-align:-3px}   /* after a space, so it moves under a label that fills the column */
  .tbl th:not([aria-sort]) .sb svg{display:none}
  .tbl th[aria-sort="ascending"] .sb svg{transform:rotate(180deg)}
  .tbl .tf{display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;color:var(--muted)}
  .tbl .tf.on{color:var(--on-accent);background:var(--accent)}
  .tbl .n{text-align:right;font-variant-numeric:tabular-nums}
  .tbl td .hint,.tbl td .tbtn,.tbl td.empty{font-size:13px}
  .tbl td .tbtn{min-height:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-weight:400}
  .tbl td input[type=checkbox]{width:16px;height:16px;vertical-align:middle}
  .tbl td input[data-rcost],.tbl td input[data-rprice]{min-height:0;height:24px;margin:-3px 0;padding:0 6px;font-size:13px;text-align:right}
  .tbl tr.off td{color:var(--muted)}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl tr[data-act]{cursor:pointer}
  .tbl tr:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
  /* A column filter: tick boxes, or a from and to date, under the header button that opened it. */
  .pop{position:fixed;z-index:15;width:240px;max-height:min(440px,calc(100dvh - 140px));overflow:auto;padding:6px 12px 10px;background:var(--raise);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .pop[hidden]{display:none}
  .pop .links{column-gap:16px}.pop .tbtn{min-height:32px;font-size:13px}
  .pop .check{min-height:30px;gap:8px;font-size:13px;margin:0}.pop .check input{width:16px;height:16px}
  .pop label{margin:6px 0 4px}.pop input:not([type=checkbox]){min-height:36px;font-size:13px}
  /* New sale: the customer in one row, the lines as a table, the total and the button at the right. */
  .frow{display:flex;gap:12px}.frow>div{flex:1;min-width:0}.frow>div:nth-child(3){flex:.8}.frow>div:nth-child(4){flex:1.5}
  .tbl.lines{max-height:none;container-type:inline-size}
  .lines td:first-child{white-space:normal}
  .lines .picked{min-height:36px;padding:0 10px}.lines .picked .name{font-size:13px}.lines .picked .hint{display:none}.lines .picked .tbtn{min-height:0;align-self:center;font-size:13px}
  .lines input{min-height:36px;font-size:13px;padding:0 8px}.lines input[type=number]{text-align:right}
  .lines tr:has(+ .note) td{border-bottom:0}
  .lines .note td{padding:0 8px 12px;white-space:normal;overflow:visible}
  .lines .note td>*{position:sticky;left:8px;max-width:calc(100cqw - 16px)}   /* a notice stays in view while the lines scroll sideways */
  .lines .exp{display:flex;align-items:center;gap:8px}.lines .exp label{margin:0}.lines .exp select,.lines .exp input{width:auto;min-height:32px;font-size:13px;padding:0 8px}
  .send{align-self:flex-end;width:min(100%,400px);display:flex;flex-direction:column;gap:20px}
  .layer{align-items:center}
  .sheet{max-width:560px;max-height:88dvh;border-bottom:1px solid var(--line);padding:20px 24px 24px}
  .toast{left:calc(50% + 114px);bottom:28px}
  .applybar{bottom:0}
}
@media(hover:hover){button.item:hover .name,.sug button:not([disabled]):hover b,nav.tabs button:hover{text-decoration:underline;text-underline-offset:4px}.icon:hover,.sync:hover{color:var(--text)}.tbl tr[data-act]:hover td{background:var(--field)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title"></h1>
    <button class="sync" id="syncBtn" data-act="sync" aria-label="Sync now"><span id="syncTxt"></span></button>
    <button class="icon" id="setBtn" data-act="settings" aria-label="Settings"></button>
    <button class="icon" id="backBtn" data-act="back" aria-label="Leave this page" hidden></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Main"><button class="navtog" id="navTog" data-act="navMini" aria-controls="tabs"></button><div class="in" id="tabs"></div></nav>
<div class="layer" id="layer" hidden><div class="scrim" data-act="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

const todayISO = () => isoOf(new Date());

  else return null;

/** A release date is a best guess: a year, a year and month, or a full date. '' when blank, null when not understood. */
function parseRel(s) {
  s = String(s || '').trim(); if (!s) return '';

}

const IN_ONLY = ['Opening', 'Restock', 'Return'], OUT_ONLY = ['Sale', 'Damaged', 'Lost'], EITHER = ['Count', 'Correction', 'Other'];

  sellSeg: 'list', supTab: 'sups', iq: '', sf: 'all', inv: newInv(), f: null, sub: null, sheetFn: null, img: null, manual: null, homeMore: false, from: 'home', warn: [], impResult: null, sort: {}, tf: {} };

const saveQueue = () => store.set('queue', queue);
const savePrefs = () => store.set('prefs', prefs);

/**

            status: l.follow ? FOLLOW : DELIVERED, expected: l.follow ? l.expected || '' : '', orderLine: l.follow ? l.orderLine || '' : '', delivered: l.follow ? '' : v.date })), q });
        const made = invs[invs.length - 1];
        v.lines.forEach((l, k) => { if (!l.follow) sale(made, k + 1, l.sku, l.qty, v.date, l.cost, q); });
        break;
      }
      case 'deliver': { const [v, l] = lineOf(q); if (l) { Object.assign(l, { status: DELIVERED, cost: q.cost, delivered: q.date }); v.w = q; sale(v, l.line, l.sku, l.qty, q.date, q.cost, q); } break; }

        const r = q.ret, v = find(invs, r.invId);

}
/**
 * FIFO replay, the same as Code.gs: per SKU the units on hand oldest first ({ id, date, reason, cost, unit }, one per unit),
 * the deficit an Out could not take, and stock (units less deficit; one of the two is always zero). An In covers the
 * deficit first. An Out takes from the front, but a Correction that reverses an In takes that In's units first.

    const s = by.get(m.sku) || by.set(m.sku, { units: [], deficit: 0, stock: 0 }).get(m.sku);

const itemName = sku => (live().map.get(sku) || { name: sku }).name;
const stockOf = sku => onHand(sku).stock;
/** Cost of the units on hand: the sum of the known costs, and how many have none. */
const stockCost = sku => { const u = onHand(sku).units; return { value: r2(u.reduce((s, x) => s + (x.cost || 0), 0)), none: u.filter(x => x.cost == null).length }; };

const costsText = list => { const k = list.filter(x => x != null); if (!k.length) return ''; const lo = Math.min(...k), hi = Math.max(...k); return lo === hi ? fmtNum(lo) : fmtNum(lo) + ' to ' + fmtNum(hi); };

const freeOf = sku => { const n = nums(sku); return Math.max(n.have, 0) - n.owed; };

/** Invoices take one plain sequential number series. */
const nextNo = () => 1 + Math.max(0, ...live().invs.map(v => v.no || 0));
function findItem(text) {
  const t = String(text || '').trim(); if (!t) return null;
  const L = live(); const n = norm(t);

}
function similarItem(name) {

  return bs >= 0.5 ? best : null;
}
const custKey = s => norm(s) || String(s).trim().toLowerCase();
/** Finds the customer by name or queues a new one; a newly typed contact replaces the one on file. Returns the ID. */
function custFor(name, contact) {
  name = name.trim().replace(/\s+/g, ' '); contact = String(contact || '').trim();
  const cur = [...live().custs.values()].find(c => custKey(c.name) === custKey(name));
  if (cur) { if (contact && contact !== cur.contact) { qAdd('cust', { cust: { id: cur.id, name: cur.name, contact } }); dirty(); } return cur.id; }
  const id = 'c' + uid(); qAdd('cust', { cust: { id, name, contact } }); dirty(); return id;
}
const contactOf = d => { const c = live().custs.get(d.custId); return (c && c.contact) || d.contact || ''; };

function returnable(v, sku) { return v.lines.filter(l => l.sku === sku && l.status === DELIVERED).reduce((s, l) => s + l.qty, 0) - live().rets.filter(r => r.invId === v.id && r.sku === sku).reduce((s, r) => s + r.qty, 0); }

/* Inventory */

const stockScope = () => live().list.filter(i => ui.filter === 'arch' ? !i.active : i.active);

}
const stockRow = i => ({ i, n: nums(i.sku), c: onHand(i.sku).units.map(x => x.cost).filter(x => x != null), v: stockCost(i.sku).value });
/** Inventory on desktop: every field of a product, sortable, for reading only. Manufacturer, Brand, Product line, Character and Release date filter from their headers. */

    ['Release date', r => r.i.rel, r => relCell(r.i), 'date', 'rel'], ['Price', r => r.i.price, r => r.i.price == null ? '–' : money(r.i.price), 'money'],

/* The Inventory column filters (desktop): ui.tf.mfr, brand, line and chr hold the ticked values, and none ticked means no filter; ui.tf.from and to bound the release date. */

/* Cost fields: one per unit when stock comes in, on every screen that takes stock in */
// State c = { v, open } at a ui path: v[k] is what was typed in field k (unset until typed in); open shows a field per unit past 12.
const newCosts = () => ({ v: [], open: false });
const costAt = (c, k) => String(c.v[k] != null ? c.v[k] : c.v[0] || '');   // a field not typed in shows what the first one holds

function costFields(path, n) {
  const c = getPath(path); n = Math.max(parseInt(n, 10) || 0, 0);
  const field = (k, label) => `<div><label for="${path}.${k}">${label}</label><input id="${path}.${k}" type="number" inputmode="decimal" min="0" step="any" data-cost="${path}" data-k="${k}" value="${esc(costAt(c, k))}" placeholder="Optional"></div>`;
  return `<div class="row2" data-costbox="${path}">${n > 12 && !c.open ? field(0, 'Cost each') + `<div style="display:flex;align-items:flex-end"><button class="tbtn" data-act="costOpen" data-p="${path}" data-n="${n}">Different costs per unit</button></div>`
    : Array.from({ length: n }, (_, k) => field(k, `Unit ${k + 1} cost`)).join('')}</div>`;
}
const redrawCosts = (path, n) => { const b = $(`[data-costbox="${path}"]`); if (b) b.outerHTML = costFields(path, n); };
/** Typing in a cost field. Typing in the first one fills every field not typed in yet. */
function costInput(t) {
  const c = getPath(t.dataset.cost), k = +t.dataset.k; c.v[k] = t.value;
  if (!k) document.querySelectorAll(`[data-cost="${t.dataset.cost}"]`).forEach(e => { if (+e.dataset.k && c.v[+e.dataset.k] == null) e.value = t.value; });
}

function readCosts(path, n) {
  const c = getPath(path), out = Array.from({ length: n }, (_, k) => costAt(c, k).trim() === '' ? null : Number(costAt(c, k)));
  return out.some(x => x != null && (isNaN(x) || x < 0)) ? undefined : out;
}

/** A cost changed on the product sheet: one cost entry for that unit's In movement, the last one typed winning. */

}

function saveItem(sku) {
  const name = $('#fName').value.trim().replace(/\s+/g, ' ');

    closeSheet(); commit(); toast(`${name} added`);
  }
}

/* Activity */

  page();

  if (shop.name) { text(shop.name, M, ly, { size: 15, bold: true }); ly += 15; }
  font(9.5); wrap(shop.contact || '', 250).filter(Boolean).forEach(l => { text(l, M, ly, { size: 9.5, color: '#6f6b76' }); ly += 13; });
  let ry = y + 16;

  text('No. ' + v.no, R, ry, { size: 11, align: 'right' }); ry += 15;
  text(day(v.date), R, ry, { size: 10, color: '#6f6b76', align: 'right' });

  const t = ev.target;
  if (t.id === 'mvReason') ui.mv.reason = t.value;
  if (t.dataset.unit) setUnitCost(t.dataset.unit, t.value);
  if (t.dataset.rcost) setRowCost(t);
  if (t.dataset.rprice) setRowPrice(t);
  if (t.dataset.tfv) { ui.tf[t.dataset.tfv] = [...$('#pop').querySelectorAll('[data-tfv]:checked')].map(x => x.value); renderStockList(); }
  if (t.id === 'fxUse') { const n = $('#fxCount'); n.dataset.have = t.checked ? t.dataset.have : 0; redrawCosts('f.c', n.value - n.dataset.have); }   // the count then means the stock of that item
  if (t.id === 'sLogo' && t.files && t.files[0]) setLogo(t.files[0]);
  // A known customer's name brings their contact with it.
  if (t.dataset.cust) { const o = getPath(t.dataset.cust), c = [...live().custs.values()].find(c => custKey(c.name) === custKey(t.value)); if (o && c && c.contact && !o.contact) { o.contact = c.contact; rerender(); } }
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'manual') ui.manual = ev.target.open; if (ev.target.dataset && ev.target.dataset.grp && ui.imp) ui.imp.open[ev.target.dataset.grp] = ev.target.open; }, true);
// Pasting Claude's block shows the preview at once; the Preview button is for after hand edits.
document.addEventListener('paste', ev => { if (ev.target.id === 'impText') setTimeout(impParse, 0); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { closePop(); if (!$('#layer').hidden) closeSheet(); } if (ev.key === 'Enter' && ev.target.matches('tr[data-act]')) ev.target.click(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(); });
window.addEventListener('online', () => scheduleSync());

/* ---------- start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
applyTheme();
$('#setBtn').innerHTML = icon('sliders', 20); $('#backBtn').innerHTML = icon('close', 22);
render();
if (cfg.url) syncNow(false);
</script>
</body>
</html>
