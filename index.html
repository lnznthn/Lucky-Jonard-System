<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toy Stock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Toy Stock</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1b20;--mute:#6f6b76;--line:#e9e3d9;--accent:#e4572e;--accent-ink:#fff;--blue:#2f6fe4;--good:#1f8f57;--warn:#b57a00;--bad:#d03b3b;--chip:#f1ece3;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#141417;--card:#1d1d22;--ink:#f1eee9;--mute:#9a96a3;--line:#2b2b32;--accent:#ff7447;--accent-ink:#1a0d08;--blue:#7aa6ff;--good:#4cc38a;--warn:#e7b23c;--bad:#ff6b6b;--chip:#26262c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{max-width:720px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5}
header.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
main{flex:1;padding:4px 16px calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.sync{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.sync.ok .dot{background:var(--good)}.sync.pending .dot{background:var(--warn)}.sync.err .dot{background:var(--bad)}
.sync.busy .dot{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:20px;line-height:1;font-weight:400}
nav.tabs button.on{color:var(--accent);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.card small{display:block;color:var(--mute);font-size:12px}.card b{font-size:19px;letter-spacing:-.01em}
.card.warn b{color:var(--warn)}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;min-height:44px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.big{width:100%;min-height:50px;font-size:17px}
.btn[disabled]{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.dir button.on.in{color:var(--good)}.seg.dir button.on.out{color:var(--bad)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;min-height:56px}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{min-width:48px;text-align:center;font-weight:700;font-size:18px;border-radius:10px;padding:4px 8px;background:var(--chip)}
.qty.low{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.qty.out,.qty.neg{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.delta{min-width:52px;text-align:center;font-weight:700}.delta.in{color:var(--good)}.delta.out{color:var(--bad)}
.day{font-size:13px;color:var(--mute);margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.04em}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--chip);color:var(--mute);font-weight:500}
.tag.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
label,.lbl{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;gap:6px}.step button{width:46px;border:1px solid var(--line);background:var(--chip);border-radius:12px;font-size:22px}
.step input{text-align:center;font-weight:700;font-size:18px}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.sug:empty{display:none}
.sug button{border:0;border-bottom:1px solid var(--line);background:var(--card);padding:10px 12px;text-align:left;min-height:46px}
.sug button:last-child{border-bottom:0}
.picked{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--chip)}
.picked .main{flex:1;min-width:0}
.hint{color:var(--mute);font-size:14px;margin:2px 2px}
.hint b{color:var(--ink)}
.banner{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;font-size:14px}
.banner.warn{border-color:var(--warn)}.banner.bad{border-color:var(--bad)}
.banner span{flex:1}
.empty{text-align:center;color:var(--mute);padding:34px 18px}
.empty h3{color:var(--ink);margin:0 0 6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.actions .btn{flex:1}
.prev{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:12px;overflow:hidden}
.prow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.prow:last-child{border-bottom:0}
.prow.off{opacity:.55}
.prow input[type=checkbox]{width:22px;height:22px;min-height:0;margin-top:2px;accent-color:var(--accent)}
.prow .main{flex:1;min-width:0}
.prow .name{font-weight:600}
.prow .sub{font-size:13px;color:var(--mute)}
.prow .go{border:0;background:none;color:var(--blue);padding:2px 0;font-size:13px;text-decoration:underline}
.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.layer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:720px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:20px}
.sheet .top{display:flex;align-items:center;gap:8px}.sheet .top h2{flex:1}
.bigqty{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);margin-top:10px}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
details pre{white-space:pre-wrap;font-size:13px;margin:8px 0 0;font-family:ui-monospace,Menlo,monospace}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.row3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.row3 .btn{width:46px;padding:0}
.lineb{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.tot{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end}.tot small{color:var(--mute);font-size:13px}.tot b{font-size:24px;letter-spacing:-.01em}
.amt{font-weight:700;white-space:nowrap}.amt.big{font-size:20px}
div.item{cursor:default}
.tag.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.seg.s3 button{font-size:13px;line-height:1.15;padding:0 4px}
textarea.plain{font-family:inherit;font-size:16px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.logo{max-height:48px;max-width:120px;border-radius:8px;border:1px solid var(--line);background:#fff;flex:none}
.panel>.hint,.sheet>.hint{margin:0}
details.mini{margin:0;border:0;background:none;padding:0}.row2>details.mini{align-self:end}details.mini summary{padding:6px 2px}details.mini[open] summary{margin-bottom:4px}

/* ---------- desktop: side navigation, wider pages, two columns, sheets as dialogs ---------- */
@media(min-width:900px){
  .app{max-width:none;margin:0 0 0 228px}
  header.top{padding:18px 32px 10px}
  header.top h1{font-size:26px}
  main{padding:6px 32px 48px;max-width:1160px}
  main.v-stock{max-width:1000px}
  main.v-import,main.v-activity,main.v-move{max-width:760px}
  nav.tabs{top:0;right:auto;width:228px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:18px 12px}
  nav.tabs::before{content:'Toy Stock';font-weight:700;font-size:20px;letter-spacing:-.01em;padding:4px 14px 18px}
  nav.tabs .in{flex-direction:column;gap:4px;max-width:none}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px}
  nav.tabs button b{width:22px;text-align:center}
  nav.tabs button.on{background:var(--chip)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .cols.sell{grid-template-columns:minmax(0,440px) minmax(0,1fr)}
  .cols>div>.day:first-child{margin-top:2px}
  .cards{gap:12px}.card{padding:14px}.card b{font-size:22px}
  .layer{align-items:center}
  .sheet{max-width:560px;border-radius:20px;max-height:88dvh;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .toast{left:calc(50% + 114px);bottom:28px}
  .btn.big{min-height:48px}
}
@media(hover:hover){button.item:hover,.sug button:not([disabled]):hover,nav.tabs button:hover{background:color-mix(in srgb,var(--chip) 70%,transparent)}.btn:not([disabled]):hover,.chip:hover,.icon:hover{filter:brightness(.97)}}
</style>

<body>
<div class="app">
  <header class="top">
    <h1>Toy Stock</h1>
    <button class="sync" id="syncBtn" data-act="sync" aria-label="Sync"><i class="dot"></i><span id="syncTxt"></span></button>
    <button class="icon" data-act="settings" aria-label="Settings">⚙</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="layer" id="layer" hidden><div class="scrim" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const VERSION = '2.0.0';

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const store = {
  get(k, d) { try { const v = localStorage.getItem('toys.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('toys.' + k, JSON.stringify(v)); } catch (e) { toast('This device is out of storage space.'); } },
};
function norm(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function jaccard(a, b) { const A = new Set(norm(a).split(' ').filter(Boolean)), B = new Set(norm(b).split(' ').filter(Boolean)); if (!A.size || !B.size) return 0; let n = 0; A.forEach(t => { if (B.has(t)) n++; }); return n / (A.size + B.size - n); }
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function parseDate(s) {
  s = String(s || '').trim(); if (!s) return todayISO();
  let y, m, d, x;
  if ((x = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))) { y = +x[1]; m = +x[2]; d = +x[3]; }
  else if ((x = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/.exec(s))) { m = +x[1]; d = +x[2]; y = +x[3]; if (y < 100) y += 2000; }
  else return null;
  const t = new Date(Date.UTC(y, m - 1, d));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== m - 1 || t.getUTCDate() !== d) return null;
  return t.toISOString().slice(0, 10);
}
/** A release date is a best guess: a year, a year and month, or a full date. '' when blank, null when not understood. */
function parseRel(s) {
  s = String(s || '').trim(); if (!s) return '';
  let x;
  if (/^\d{4}$/.test(s)) return s;
  if ((x = /^(\d{4})-(\d{1,2})$/.exec(s)) && +x[2] >= 1 && +x[2] <= 12) return x[1] + '-' + x[2].padStart(2, '0');
  return /^\d{4}-\d{1,2}-\d{1,2}$/.test(s) || s.includes('/') ? parseDate(s) : null;
}
function fmtDay(iso) {
  const t = todayISO(); if (iso === t) return 'Today';
  const y = new Date(); y.setDate(y.getDate() - 1); if (iso === new Date(y.getTime() - y.getTimezoneOffset() * 60000).toISOString().slice(0, 10)) return 'Yesterday';
  return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: iso.slice(0, 4) === t.slice(0, 4) ? undefined : 'numeric' });
}
const money = n => prefs.cur + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
const signed = (dir, q) => (dir === 'In' ? '+' : '−') + q;
const r2 = n => Math.round(n * 100) / 100;
const getPath = p => p.split('.').reduce((o, k) => (o == null ? o : o[k]), ui);
function setPath(p, v) { const ks = p.split('.'), last = ks.pop(), o = ks.reduce((o, k) => (o == null ? o : o[k]), ui); if (o) o[last] = v; }

/* ---------- rules shared with apps-script/Code.gs ---------- */
const IN_ONLY = ['Opening', 'Restock', 'Return'], OUT_ONLY = ['Sale', 'Damaged', 'Lost'], EITHER = ['Count', 'Correction', 'Other'];
const FORM_REASONS = { In: ['Restock', 'Return', 'Opening', 'Other'], Out: ['Sale', 'Damaged', 'Lost', 'Other'] };
const reasonOK = (dir, r) => EITHER.includes(r) || (dir === 'In' ? IN_ONLY : OUT_ONLY).includes(r);
const defaultReason = dir => (dir === 'In' ? 'Restock' : 'Sale');
const PRE_OPEN = 'Open', PRE_DONE = 'Fulfilled', PRE_CANCEL = 'Cancelled';
const SALE = 'Sale', RECEIPT = 'Pre-order receipt';
// What a return does to stock, per outcome. Same table as RETURN_STOCK_ in Code.gs: change both together.
const RETURN_STOCK = { 'Restock': 'In', 'Write-off': null };
const RETURN_HINT = { 'Restock': 'Goes back into stock.', 'Write-off': 'Does not go back into stock.' };

/* ---------- state ---------- */
let cfg = store.get('cfg', { url: '', key: '' });
let items = store.get('items', []);       // synced items
let moves = store.get('moves', []);       // synced movements, in sheet order
let docs = Object.assign({ custs: [], orders: [], pres: [], invs: [], rets: [], inbox: [] }, store.get('docs', {}));   // synced documents
let meta = store.get('meta', { rows: 0, lastId: '', syncedAt: null });
let queue = store.get('queue', []);       // entries waiting for the sheet
let prefs = Object.assign({ tab: 'home', cur: '₱', low: 2 }, store.get('prefs', {}));
if (prefs.tab === 'move') prefs.tab = 'home';
prefs.shop = Object.assign({ name: '', contact: '', foot: '', logo: '' }, prefs.shop);
const newInv = () => ({ cust: '', contact: '', date: todayISO(), lines: [{ sku: '', qty: 1, price: '' }], preId: '' });
let ui = { q: '', cat: 'All', filter: 'all', aq: '', aSku: '', aN: 150, mv: null, mode: 'count', text: '', imp: null, rdate: todayISO(), err: '', busy: false,
  sellSeg: 'new', ordSeg: 'pre', iq: '', inv: newInv(), f: null, sub: null, sheetFn: null, pdf: null, manual: false };
let _live = null;
const dirty = () => { _live = null; };
const saveQueue = () => store.set('queue', queue);
const savePrefs = () => store.set('prefs', prefs);
const saveSynced = () => { store.set('items', items); store.set('moves', moves); store.set('docs', docs); store.set('meta', meta); };

/**
 * Synced data plus pending queue entries: what the screen shows. Failed entries are not counted.
 * Pending documents are replayed the way Code.gs will apply them, including the movements they write.
 * On a document, q is the entry that creates it (not in the sheet yet) and w is a change still waiting.
 */
function live() {
  if (_live) return _live;
  const map = new Map(items.map(i => [i.sku, { ...i }]));
  const custs = new Map(docs.custs.map(c => [c.id, { ...c }]));
  const orders = docs.orders.map(o => ({ ...o })), pres = docs.pres.map(p => ({ ...p })), invs = docs.invs.map(v => ({ ...v })), rets = docs.rets.map(r => ({ ...r }));
  const all = moves.map((m, i) => ({ ...m, _i: i }));
  const push = (m, q) => all.push({ ...m, _i: all.length, q });
  const find = (list, id) => list.find(x => x.id === id);
  const nameOf = sku => (map.get(sku) || { name: sku }).name, handled = new Set();
  for (const q of queue) {
    if (q.kind === 'move') { push(q.move, q); continue; }
    if (q.status !== 'pending') continue;
    switch (q.kind) {
      case 'item': if (!map.has(q.item.sku)) map.set(q.item.sku, { ...q.item }); break;
      case 'edit': if (map.has(q.sku)) Object.assign(map.get(q.sku), q.patch); break;
      case 'cust': custs.set(q.cust.id, { ...q.cust }); break;
      case 'order': orders.push({ ...q.order, name: nameOf(q.order.sku), status: 'Ordered', recQty: null, recDate: '', q }); break;
      case 'receive': { const o = find(orders, q.orderId); if (o && o.status === 'Ordered') { o.status = 'Received'; o.recQty = q.qty; o.recDate = q.date; o.w = q; push({ id: 'rcv-' + o.id, date: q.date, sku: o.sku, dir: 'In', qty: q.qty, reason: 'Restock', ref: o.id, note: '', cost: q.cost }, q); } break; }
      case 'orderCancel': { const o = find(orders, q.orderId); if (o && o.status === 'Ordered') { o.status = 'Cancelled'; o.w = q; } break; }

  const L = live(), act = L.list.filter(i => i.active);
  let units = 0, value = 0, attention = 0;
  act.forEach(i => { const n = Math.max(L.stock.get(i.sku) || 0, 0); units += n; if (i.price != null) value += n * i.price; if (status(i) !== 'ok') attention++; });
  if (!L.list.length) {
    view().innerHTML = `<div class="empty"><h3>No toys yet</h3><p>Add one by hand, or send Claude photos of the boxes or shelves and review what it read under Import.</p>
      <div class="actions"><button class="btn primary" data-act="newItem">Add a toy</button><button class="btn" data-act="tab" data-t="import">Import from a photo</button></div></div>`;
    return;
  }
  view().innerHTML = `
    <div class="cards">
      <div class="card"><small>Units</small><b>${units.toLocaleString()}</b></div>
      <div class="card"><small>Toys</small><b>${act.length}</b></div>
      <div class="card ${attention ? 'warn' : ''}"><small>Low / out</small><b>${attention}</b></div>
      <div class="card"><small>Retail value</small><b>${value ? money(Math.round(value)) : '–'}</b></div>
    </div>
    <div class="bar"><input id="q" type="search" placeholder="Search name, brand, character or SKU" value="${esc(ui.q)}" autocomplete="off"><button class="btn primary" data-act="newItem">+ Toy</button></div>
    <div class="chips">${['All', ...L.cats].map(c => `<button class="chip ${ui.cat === c ? 'on' : ''}" data-act="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    ${STOCK_FILTERS[ui.filter] ? `<div class="chips"><button class="chip on" data-act="filter" data-f="all">${STOCK_FILTERS[ui.filter]} ✕</button></div>` : ''}
    <div class="seg">${[['all', 'All'], ['attn', 'Low / out'], ['out', 'Out'], ['arch', 'Archived']].map(([k, n]) => `<button class="${ui.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${n}</button>`).join('')}</div>
    <div id="stockList"></div>`;
  renderStockList();
}
function renderStockList() {
  const L = live(), q = norm(ui.q);
  let rows = L.list.filter(i => ui.filter === 'arch' ? !i.active : i.active);
  if (ui.cat !== 'All') rows = rows.filter(i => catOf(i) === ui.cat);
  if (q) rows = rows.filter(i => norm([i.name, i.sku, catOf(i), i.mfr, i.brand, i.line, i.chr].join(' ')).includes(q));
  if (ui.filter === 'attn') rows = rows.filter(i => status(i) !== 'ok');
  if (ui.filter === 'out') rows = rows.filter(i => ['out', 'neg'].includes(status(i)));
  if (ui.filter === 'short') rows = rows.filter(i => { const n = nums(i.sku); return n.owed > 0 && n.ltp < 0; });
  if (ui.filter === 'noprice') rows = rows.filter(i => i.price == null);
  if (ui.filter === 'verify') rows = rows.filter(i => i.relCheck);
  const box = $('#stockList'); if (!box) return;
  if (!rows.length) { box.innerHTML = `<div class="empty">Nothing matches.</div>`; return; }
  box.innerHTML = `<div class="list">${rows.slice(0, 400).map(i => {
    const s = status(i), n = nums(i.sku);
    return `<button class="item" data-act="item" data-sku="${esc(i.sku)}"><div class="main"><div class="name">${esc(i.name)}</div><div class="sub">${esc(catOf(i))} · ${esc(i.sku)}${i.price != null ? ' · ' + money(i.price) : ''}${n.inc ? ' · ' + n.inc + ' incoming' : ''}${n.owed ? ' · ' + n.owed + ' owed' : ''}${s === 'low' ? ' · reorder at ' + minOf(i) : ''}</div></div><div class="qty ${s}">${n.have}</div></button>`;
  }).join('')}</div>${rows.length > 400 ? `<p class="hint">Showing the first 400. Search to narrow down.</p>` : ''}`;
}
function openItem(sku) {
  const L = live(), i = L.map.get(sku); if (!i) return;
  const n = nums(sku), s = status(i), a = L.avg.get(sku);
  const recent = L.all.filter(m => m.sku === sku).sort(cmpMove).slice(0, 6);
  const det = [['Manufacturer', i.mfr], ['Brand', i.brand], ['Toy line', i.line], ['Character', i.chr]].filter(d => d[1]);
  openSheet(`
    <div class="top"><h2>${esc(i.name)}</h2>${closeBtn}</div>
    <div class="sub hint">${esc(catOf(i))} · ${esc(i.sku)}${i.price != null ? ' · ' + money(i.price) : ''}${i.active ? '' : ' · archived'}</div>
    <div class="picked"><div class="main"><div class="bigqty">${n.have}</div><div class="hint">in stock${s === 'low' ? ' · low (reorder at ' + minOf(i) + ')' : s === 'out' ? ' · out of stock' : s === 'neg' ? ' · negative, run a count' : ''}</div></div></div>
    <div class="cards c3"><div class="card"><small>Incoming</small><b>${n.inc}</b></div><div class="card"><small>Owed to customers</small><b>${n.owed}</b></div><div class="card ${n.ltp < 0 ? 'warn' : ''}"><small>Left to promise</small><b>${n.ltp}</b></div></div>
    <div class="actions" style="margin-bottom:0"><button class="btn primary" data-act="toyGo" data-to="sell" data-sku="${esc(sku)}">Sell</button><button class="btn" data-act="toyGo" data-to="pre" data-sku="${esc(sku)}">Pre-order</button><button class="btn" data-act="toyGo" data-to="ord" data-sku="${esc(sku)}">Order stock</button></div>
    <div class="actions" style="margin-top:0"><button class="btn" data-act="moveFor" data-sku="${esc(sku)}" data-dir="In">+ Stock in</button><button class="btn" data-act="moveFor" data-sku="${esc(sku)}" data-dir="Out">− Stock out</button><button class="btn" data-act="editItem" data-sku="${esc(sku)}">Edit</button></div>
    <dl class="kv">${det.map(d => `<dt>${d[0]}</dt><dd>${esc(d[1])}</dd>`).join('')}${i.rel ? `<dt>Release date</dt><dd>${esc(i.rel)}${i.relCheck ? ' <span class="tag warn">to verify</span>' : ''}</dd>` : ''}<dt>Average cost</dt><dd>${a == null ? 'No cost recorded yet' : money(r2(a))}</dd></dl>
    <div><div class="lbl">Recent movements</div>${recent.length ? `<div class="list">${recent.map(m => moveRow(m, false)).join('')}</div><button class="btn" style="margin-top:8px;width:100%" data-act="seeAll" data-sku="${esc(sku)}">See all in Activity</button>` : `<div class="hint">None yet.</div>`}</div>`);
}

    ${i ? '' : `<div class="row2"><div><label for="fStart">Starting stock</label><input id="fStart" type="number" inputmode="numeric" min="0" step="1" value="0"></div><div><label for="fCost">Cost each (${esc(prefs.cur)})</label><input id="fCost" type="number" inputmode="decimal" min="0" step="any" placeholder="Optional"></div></div>`}
    <details ${i && (i.mfr || i.brand || i.line || i.chr || i.rel) ? 'open' : ''}><summary>Toy details</summary>
      <div class="row2" style="margin-top:10px"><div><label for="fMfr">Manufacturer</label><input id="fMfr" value="${v('mfr')}" autocomplete="off"></div><div><label for="fBrand">Brand</label><input id="fBrand" value="${v('brand')}" autocomplete="off"></div></div>
      <div class="row2" style="margin-top:10px"><div><label for="fLine">Toy line</label><input id="fLine" value="${v('line')}" autocomplete="off"></div><div><label for="fChr">Character</label><input id="fChr" value="${v('chr')}" autocomplete="off"></div></div>
      <div style="margin-top:10px"><label for="fRel">Release date</label><input id="fRel" value="${v('rel')}" placeholder="2024-07-15, 2024-07 or 2024" autocomplete="off"></div>
      <label class="check" style="margin:10px 0 4px"><input id="fRelCheck" type="checkbox" ${i && i.relCheck ? 'checked' : ''}> Release date still needs checking</label>
    </details>
    <details><summary>Reorder level and SKU</summary>
      <div class="row2" style="margin:10px 0 4px"><div><label for="fMin">Reorder at</label><input id="fMin" type="number" inputmode="numeric" min="0" step="1" placeholder="${prefs.low}" value="${i && i.min != null ? i.min : ''}"></div>
      <div><label for="fSku">SKU / barcode</label><input id="fSku" value="${esc(i ? i.sku : nextSku())}" data-sug="${esc(i ? '' : nextSku())}" ${i ? 'disabled' : ''} autocomplete="off"></div></div>
    </details>
    <div class="actions"><button class="btn primary" data-act="saveItem" ${i ? `data-sku="${esc(i.sku)}"` : ''}>Save</button>${i ? `<button class="btn ${i.active ? 'danger' : ''}" data-act="archive" data-sku="${esc(i.sku)}">${i.active ? 'Archive' : 'Restore'}</button>` : ''}</div>`);
}
function saveItem(sku) {
  const name = $('#fName').value.trim().replace(/\s+/g, ' '), cat = $('#fCat').value.trim() || 'General';
  const price = $('#fPrice').value === '' ? null : Number($('#fPrice').value);
  const min = $('#fMin').value === '' ? null : Number($('#fMin').value);
  const det = { mfr: $('#fMfr').value.trim(), brand: $('#fBrand').value.trim(), line: $('#fLine').value.trim(), chr: $('#fChr').value.trim(), rel: parseRel($('#fRel').value), relCheck: $('#fRelCheck').checked };
  if (!name) return toast('Give the toy a name.');
  if (price != null && (isNaN(price) || price < 0)) return toast('Price must be zero or more.');
  if (min != null && (!Number.isInteger(min) || min < 0)) return toast('Reorder level must be a whole number.');
  if (det.rel == null) return toast('Release date should look like 2024-07-15, 2024-07 or 2024.');
  const clash = live().list.find(x => norm(x.name) === norm(name) && x.sku !== sku);
  if (clash) return toast(`“${clash.name}” already exists.`);
  if (sku) {
    const cur = live().map.get(sku), patch = {};
    if (name !== cur.name) patch.name = name; if (cat !== catOf(cur)) patch.cat = cat;
    if (price !== cur.price) patch.price = price; if (min !== (cur.min == null ? null : cur.min)) patch.min = min;
    ['mfr', 'brand', 'line', 'chr', 'rel'].forEach(k => { if (det[k] !== (cur[k] || '')) patch[k] = det[k]; });
    if (det.relCheck !== !!cur.relCheck) patch.relCheck = det.relCheck;
    if (Object.keys(patch).length) qEdit(sku, patch);
    closeSheet(); commit(); toast('Saved');
  } else {
    const nsku = $('#fSku').value.trim();
    if (!/^[A-Za-z0-9._-]{1,32}$/.test(nsku)) return toast('SKU can use letters, digits, dots, dashes and underscores.');
    if (live().map.has(nsku)) return toast('That SKU is already used.');
    const start = $('#fStart') && $('#fStart').value !== '' ? Number($('#fStart').value) : 0;
    if (!Number.isInteger(start) || start < 0) return toast('Starting stock must be a whole number.');
    const cost = $('#fCost').value === '' ? null : Number($('#fCost').value);
    if (cost != null && (isNaN(cost) || cost < 0)) return toast('Cost must be zero or more.');
    qItem(Object.assign({ sku: nsku, name, cat, price, min, active: true }, det), nsku === $('#fSku').dataset.sug);
    if (start > 0) qMove({ id: 'm' + uid(), date: todayISO(), sku: nsku, dir: 'In', qty: start, reason: 'Opening', ref: '', note: '', cost });
    closeSheet(); commit(); toast(`${name} added`);
  }
}

/* Move */
const newMv = (sku, dir) => ({ sku: sku || '', dir: dir || 'In', qty: 1, reason: defaultReason(dir || 'In'), date: todayISO(), note: '', cost: '' });
function renderMove() {
  const m = ui.mv || (ui.mv = newMv());
  const it = m.sku && live().map.get(m.sku), a = it ? live().avg.get(it.sku) : null;
  view().innerHTML = `<div class="panel">
    <div><div class="lbl">Toy</div><div id="pick">${it
      ? `<div class="picked"><div class="main"><div class="name">${esc(it.name)}</div><div class="hint">${esc(it.sku)} · ${stockOf(it.sku)} in stock</div></div><button class="btn" data-act="unpick">Change</button></div>`
      : `<input id="mvQ" type="search" placeholder="Search by name or SKU" autocomplete="off"><div class="sug" id="sug"></div>`}</div></div>
    <div class="seg dir" style="margin:0"><button class="in ${m.dir === 'In' ? 'on' : ''}" data-act="dir" data-d="In">In · stock arrives</button><button class="out ${m.dir === 'Out' ? 'on' : ''}" data-act="dir" data-d="Out">Out · stock leaves</button></div>
    <div class="row2">
      <div><label for="mvQty">Quantity</label><div class="step"><button data-act="qty" data-d="-1" aria-label="Less">−</button><input id="mvQty" type="number" inputmode="numeric" min="1" step="1" value="${esc(m.qty)}"><button data-act="qty" data-d="1" aria-label="More">+</button></div></div>
      <div><label for="mvReason">Reason</label><select id="mvReason">${FORM_REASONS[m.dir].map(r => `<option ${r === m.reason ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
    </div>
    ${m.dir === 'In' ? `<div><label for="mvCost">Cost each (${esc(prefs.cur)}) for this receipt</label><input id="mvCost" type="number" inputmode="decimal" min="0" step="any" value="${esc(m.cost)}" placeholder="${a == null ? 'Optional' : 'Average so far ' + money(r2(a))}"></div>` : ''}
    <div class="row2"><div><label for="mvDate">Date</label><input id="mvDate" type="date" value="${esc(m.date)}"></div><div><label for="mvNote">Note</label><input id="mvNote" value="${esc(m.note)}" placeholder="Optional" autocomplete="off"></div></div>
    <div class="hint" id="mvHint"></div>
    <button class="btn primary big" data-act="saveMove">Record ${m.dir === 'In' ? 'stock in' : 'stock out'}</button>
    ${m.dir === 'Out' ? `<p class="hint">Selling to a customer? Use <b>Sell</b>: it records the stock out and makes the invoice PDF in one step.</p>` : ''}
  </div>`;
  updateMvHint();
}
function updateMvHint() {
  const m = ui.mv, h = $('#mvHint'); if (!h) return;
  const it = m.sku && live().map.get(m.sku), q = parseInt(m.qty, 10);
  if (!it) { h.textContent = ''; return; }
  const have = stockOf(it.sku), after = have + (m.dir === 'In' ? 1 : -1) * (isNaN(q) ? 0 : q);
  h.innerHTML = `Stock <b>${have}</b> → <b style="color:${after < 0 ? 'var(--bad)' : 'inherit'}">${after}</b>${after < 0 ? ' (below zero)' : ''}`;
}
function renderSug(text) {
  const box = $('#sug'); if (!box) return;
  const n = norm(text); if (!n) { box.innerHTML = ''; return; }
  const rows = live().list.filter(i => i.active && norm(i.name + ' ' + i.sku).includes(n)).slice(0, 8);
  box.innerHTML = rows.length ? rows.map(i => `<button data-act="pick" data-sku="${esc(i.sku)}"><b>${esc(i.name)}</b> <span class="hint">${esc(i.sku)} · ${stockOf(i.sku)} in stock</span></button>`).join('') : `<button disabled>No match. Add it from Stock → + Toy.</button>`;
}
function saveMove() {
  const m = ui.mv, it = m.sku && live().map.get(m.sku);
  if (!it) return toast('Pick a toy first.');
  const qty = Number(m.qty); if (!Number.isInteger(qty) || qty < 1) return toast('Quantity must be a whole number, 1 or more.');
  const date = parseDate(m.date); if (!date) return toast('Check the date.');
  const cost = m.dir === 'In' && m.cost !== '' ? Number(m.cost) : null;
  if (cost != null && (isNaN(cost) || cost < 0)) return toast('Cost must be zero or more.');
  const have = stockOf(it.sku);
  if (m.dir === 'Out' && qty > have && !confirm(`Only ${have} in stock. Record ${qty} out anyway? Stock will show ${have - qty}.`)) return;
  qMove({ id: 'm' + uid(), date, sku: it.sku, dir: m.dir, qty, reason: m.reason, ref: '', note: String(m.note || '').trim(), cost });
  const after = have + (m.dir === 'In' ? qty : -qty);
  ui.mv = null; prefs.tab = 'stock'; savePrefs();
  commit(); toast(`${signed(m.dir, qty)} ${it.name} → ${after} in stock`);
}

/* Activity */
const cmpMove = (a, b) => (a.date === b.date ? b._i - a._i : a.date < b.date ? 1 : -1);
function moveRow(m, withName = true) {
  const it = live().map.get(m.sku), q = m.q;
  const tag = q ? (q.status === 'failed' ? '<span class="tag bad">failed</span>' : '<span class="tag warn">waiting</span>') : '';
  return `<button class="item" data-act="move" data-id="${esc(m.id)}"><div class="delta ${m.dir === 'In' ? 'in' : 'out'}">${signed(m.dir, m.qty)}</div><div class="main"><div class="name">${withName ? esc(it ? it.name : m.sku) : esc(m.reason)}${tag}</div><div class="sub">${withName ? esc(m.reason) : esc(fmtDay(m.date))}${m.reason === 'Sale' && m.ref ? ' · invoice ' + esc(m.ref) : ''}${m.note ? ' · ' + esc(m.note) : ''}</div></div></button>`;
}
function renderActivity() {
  const pend = queue.filter(q => q.status === 'pending').length, failed = queue.filter(q => q.status === 'failed').length;
  view().innerHTML = `
    ${failed ? `<div class="banner bad"><span><b>${failed}</b> entr${failed === 1 ? 'y was' : 'ies were'} refused by the sheet. Tap a tagged row to see why.</span><button class="btn" data-act="retryAll">Retry</button></div>` : ''}
    ${queue.filter(q => q.status === 'failed' && q.kind !== 'move').map(q => `<div class="banner bad"><span>${esc(describe(q))} was refused: ${esc(q.error || 'unknown reason')}.${q.kind === 'item' ? ' Deleting it also deletes stock entries waiting on it.' : ''}</span><button class="btn" data-act="dropQ" data-qid="${esc(q.id)}">Delete</button></div>`).join('')}
    ${pend && !failed ? `<div class="banner warn"><span><b>${pend}</b> waiting to reach the sheet.</span><button class="btn" data-act="sync">Sync</button></div>` : ''}
    <div class="bar"><input id="aq" type="search" placeholder="Filter activity" value="${esc(ui.aq)}" autocomplete="off"></div>
    ${ui.aSku ? `<div class="chips"><button class="chip on" data-act="clearSku">${esc((live().map.get(ui.aSku) || { name: ui.aSku }).name)} ✕</button></div>` : ''}
    <div id="actList"></div>`;
  renderActList();
}
function renderActList() {
  const box = $('#actList'); if (!box) return;
  const L = live(), q = norm(ui.aq);
  let rows = L.all.slice();
  if (ui.aSku) rows = rows.filter(m => m.sku === ui.aSku);
  if (q) rows = rows.filter(m => norm([m.date, m.sku, (L.map.get(m.sku) || {}).name, m.reason, m.note].join(' ')).includes(q));
  rows.sort(cmpMove);
  if (!rows.length) { box.innerHTML = `<div class="empty">No movements yet.</div>`; return; }
  const shown = rows.slice(0, ui.aN); let out = '', day = '';
  shown.forEach(m => { if (m.date !== day) { if (day) out += '</div>'; day = m.date; out += `<div class="day">${esc(fmtDay(day))}</div><div class="list">`; } out += moveRow(m); });
  box.innerHTML = out + '</div>' + (rows.length > shown.length ? `<div class="actions"><button class="btn" data-act="more">Show more (${rows.length - shown.length} older)</button></div>` : '');
}
function openMove(id) {
  const m = live().all.find(x => x.id === id); if (!m) return;
  const it = live().map.get(m.sku), q = m.q, own = q && q.kind === 'move';
  const reversed = live().all.some(x => x.ref === m.id && x.reason === 'Correction');
  openSheet(`
    <div class="top"><h2>${signed(m.dir, m.qty)} ${esc(it ? it.name : m.sku)}</h2>${closeBtn}</div>
    <dl class="kv"><dt>Date</dt><dd>${esc(m.date)}</dd><dt>Direction</dt><dd>${m.dir}</dd><dt>Reason</dt><dd>${esc(m.reason)}</dd><dt>SKU</dt><dd>${esc(m.sku)}</dd>${m.cost != null ? `<dt>Cost each</dt><dd>${money(m.cost)}</dd>` : ''}${m.note ? `<dt>Note</dt><dd>${esc(m.note)}</dd>` : ''}${m.ref ? `<dt>${m.reason === 'Correction' ? 'Corrects' : m.reason === 'Sale' ? 'Invoice' : 'Ref'}</dt><dd>${esc(m.ref)}</dd>` : ''}<dt>Status</dt><dd>${q ? (q.status === 'failed' ? 'Refused by the sheet: ' + esc(q.error || 'unknown reason') : 'Waiting to sync') : 'In the sheet'}</dd></dl>
    <div class="actions">${own
      ? `${q.status === 'failed' ? `<button class="btn primary" data-act="retryOne" data-qid="${esc(q.id)}">Retry</button>` : ''}<button class="btn danger" data-act="dropQ" data-qid="${esc(q.id)}">Delete</button>`
      : q ? '' : `<button class="btn ${reversed ? '' : 'primary'}" data-act="reverse" data-id="${esc(m.id)}" ${reversed ? 'disabled' : ''}>${reversed ? 'Already reversed' : 'Reverse this movement'}</button>`}</div>
    ${q && !own ? `<p class="hint">Written by ${esc(describe(q).toLowerCase())}, which is waiting to sync. Open that document to change it.</p>` : q ? '' : `<p class="hint">Movements are never edited or deleted. Reversing adds an opposite entry, so the history stays complete.</p>`}`);
}
function reverseMove(id) {
  const m = moves.find(x => x.id === id); if (!m) return;
  qMove({ id: 'm' + uid(), date: todayISO(), sku: m.sku, dir: m.dir === 'In' ? 'Out' : 'In', qty: m.qty, reason: 'Correction', ref: m.id, note: `Reverses ${m.date} ${m.dir} ${m.qty} (${m.reason})` });
  closeSheet(); commit(); toast('Reversal recorded');
}

/* ---------- Sell: invoices ---------- */
function linePrice(l) { const it = l.sku && live().map.get(l.sku); return l.price === '' ? (it && it.price != null ? it.price : null) : Number(l.price); }
function invTotal() { return r2(ui.inv.lines.reduce((s, l) => { const p = linePrice(l); return s + (parseInt(l.qty, 10) || 0) * (p == null || isNaN(p) ? 0 : p); }, 0)); }
function renderSell() {
  if (wide()) {   // New Sale and the invoice list side by side
    view().innerHTML = `<div class="cols sell"><div><div class="day">New Sale</div><div id="sellBody"></div></div><div><div class="day">Invoices</div><div class="bar"><input id="iq" type="search" placeholder="Search number, customer or toy" value="${esc(ui.iq)}" autocomplete="off"></div><div id="invList"></div></div></div>`;
    renderInvForm(); renderInvList(); return;

    const a = L.avg.get(it.sku);

      const c = parseCode($('#sCode').value);
      if (!c.url) { cfg = { url: '', key: '' }; store.set('cfg', cfg); ui.err = ''; closeSheet(); render(); toast('Disconnected. Data stays on this device.'); break; }
      if (!/^https:\/\/|^http:\/\/localhost/.test(c.url) || !c.key) { toast('Paste the web app URL, then #, then the key.'); break; }
      const prev = cfg; cfg = c;
      try { await api('ping'); store.set('cfg', cfg); closeSheet(); toast('Connected'); syncNow(false); }
      catch (e) { cfg = prev; toast(e.message); }
      break;
    }
    case 'redownload': meta = { rows: 0, lastId: '', syncedAt: null }; closeSheet(); syncNow(true); break;
    case 'savePrefs': readShopFields(); prefs.cur = $('#sCur').value.trim() || '₱'; prefs.low = Math.max(0, parseInt($('#sLow').value, 10) || 0); savePrefs(); dirty(); closeSheet(); render(); toast('Saved'); break;
    case 'logoOff': readShopFields(); prefs.shop.logo = ''; savePrefs(); openSettings(); break;
    case 'copyItems': { const L = live(); await copyText(tsv([['SKU', 'Name', 'Category', 'Price', 'Reorder at', 'Active', 'On hand', 'Incoming', 'Owed', 'Left to promise', 'Average cost', 'Manufacturer', 'Brand', 'Toy line', 'Character', 'Release date', 'Release check'], ...L.list.map(i => { const n = nums(i.sku), a = L.avg.get(i.sku); return [i.sku, i.name, catOf(i), i.price, i.min, i.active ? 'Yes' : 'No', n.have, n.inc, n.owed, n.ltp, a == null ? '' : r2(a), i.mfr, i.brand, i.line, i.chr, i.rel, i.relCheck ? 'Verify' : '']; })])); toast('Copied. Paste into a spreadsheet.'); break; }
    case 'copyMoves': await copyText(tsv([['Date', 'SKU', 'Item', 'Direction', 'Qty', 'Reason', 'Ref', 'Note', 'Unit cost'], ...live().all.sort(cmpMove).map(m => [m.date, m.sku, (live().map.get(m.sku) || {}).name, m.dir, m.qty, m.reason, m.ref, m.note, m.cost])])); toast('Copied. Paste into a spreadsheet.'); break;
    case 'wipe': if (confirm('Erase everything stored on this device?')) { ['cfg', 'items', 'moves', 'docs', 'meta', 'queue', 'prefs'].forEach(k => localStorage.removeItem('toys.' + k)); location.reload(); } break;
  }
});
function liveHints() { let e; if ((e = $('#invTotal'))) e.textContent = money(invTotal()); if ((e = $('#preHint')) && ui.f && ui.f.type === 'pre') e.innerHTML = preHint(); }
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.b) { setPath(t.dataset.b, t.value); if (t.dataset.redraw) rerender(); else liveHints(); return; }
  if (t.dataset.pk) { renderPk(t.dataset.pk, t.value); return; }
  switch (t.id) {
    case 'q': ui.q = t.value; renderStockList(); break;
    case 'aq': ui.aq = t.value; ui.aN = 150; renderActList(); break;
    case 'iq': ui.iq = t.value; renderInvList(); break;
    case 'mvQ': renderSug(t.value); break;
    case 'mvQty': ui.mv.qty = t.value; updateMvHint(); break;
    case 'mvReason': ui.mv.reason = t.value; break;
    case 'mvDate': ui.mv.date = t.value; break;
    case 'mvNote': ui.mv.note = t.value; break;
    case 'mvCost': ui.mv.cost = t.value; break;
    case 'impText': ui.text = t.value; break;
    case 'impDate': ui.rdate = t.value; break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'mvReason') ui.mv.reason = t.value;
  if (t.id === 'sLogo' && t.files && t.files[0]) setLogo(t.files[0]);
  // A known customer's name brings their contact with it.
  if (t.dataset.cust) { const o = getPath(t.dataset.cust), c = [...live().custs.values()].find(c => custKey(c.name) === custKey(t.value)); if (o && c && c.contact && !o.contact) { o.contact = c.contact; rerender(); } }
});
// Pasting Claude's block shows the preview at once; the Preview button is for after hand edits.
document.addEventListener('toggle', ev => { if (ev.target.id === 'manual') ui.manual = ev.target.open; }, true);
document.addEventListener('paste', ev => { if (ev.target.id === 'impText') setTimeout(() => { ui.text = $('#impText').value; ui.imp = { src: 'paste', mode: ui.mode, rows: IMP[ui.mode].parse(ui.text) }; renderImpOut(); }, 0); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#layer').hidden) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(); });
window.addEventListener('online', () => scheduleSync());

/* ---------- start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
if (cfg.url) syncNow(false);
</script>
</body>
</html>
